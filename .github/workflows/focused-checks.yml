name: Focused checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  third-jet-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install focused dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile publication tools
        run: >-
          python -m py_compile
          tools/build_research_release_archives.py
          tools/restore_research_archives.py
          tools/audit_github_publication.py
      - name: Run restart-time third-jet tests
        run: >-
          python -m unittest
          work/ns_collision/tests/test_annular_parallel_shear_third_internal_shell_lemma.py
